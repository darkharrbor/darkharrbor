name: Release images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Verify release invariants
        run: ./scripts/verify-release.sh
      - name: Verify release tag metadata
        run: python3 scripts/verify-sbom.py --version "${GITHUB_REF_NAME#v}"
      - name: Verify Go source
        working-directory: src
        run: |
          test -z "$(gofmt -l .)"
          go build ./...
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: darkharrbor
            suffix: ''
          - target: dockerproxy
            suffix: '-dockerproxy'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}${{ matrix.suffix }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}${{ matrix.suffix }}:latest
          provenance: mode=max
          sbom: true
