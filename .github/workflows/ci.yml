name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'

      - name: Verify release invariants
        run: ./scripts/verify-release.sh

      - name: gofmt
        run: |
          cd src
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt failed:"
            gofmt -l .
            exit 1
          fi

      - name: go build
        run: cd src && go build ./...

      - name: go vet
        run: cd src && go vet ./...

      - name: go test
        run: cd src && go test ./... -count=1

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: '2026.2.1'
          install-go: false
          working-directory: src

      - name: govulncheck
        run: |
          cd src
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
